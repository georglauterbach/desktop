[general]
live_config_reload = true
ipc_socket = true

import = [ "theme-active.toml" ]

[env]

[window]
dimensions = { columns = 0, lines = 0 }
position = "None"
padding = { x = 2, y = 0 }
dynamic_padding = true
decorations = "None"
blur = false
startup_mode = "Windowed"
title = "alacritty"
dynamic_title = true
decorations_theme_variant = "None"

# A value < 1 can cause certain characters to be displayed
# incorrectly in programs like Zellij or NeoVim.
opacity = 1

[window.class]
instance = "alacritty"
general = "alacritty"

[scrolling]
history = 10000
multiplier = 2

[font]
normal = { family = "JetBrainsMono Nerd Font" }
size = 14.0
glyph_offset = { x = 0, y = 0}
builtin_box_drawing = false

[bell]
duration = 0

[selection]
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"
save_to_clipboard = true

[cursor]
style = { shape = "Block", blinking = "Never" }
vi_mode_style = "None"
unfocused_hollow = true

[terminal]
osc52 = "CopyPaste"

[terminal.shell]
program = "bash"

[[hints.enabled]]
command = "xdg-open"
hyperlinks = true
post_processing = true
persist = false
mouse.enabled = true
binding = { key = "h", mods = "Control" }
regex = "(mailto:|https?://|file:|git://|ssh:|ftp://)[^\u0000-\u001F\u007F-\u009F<>\"\\s{-}\\^⟨⟩`]+"

[colors.selection]
background = "CellForeground"
text = "CellBackground"

[keyboard]
bindings = [
  { action = "Paste",            key = "v",      mods = "Control|Shift" },
  { action = "Copy",             key = "C",      mods = "Control|Shift" },
  { action = "IncreaseFontSize", key = "Equals", mods = "Control" },
  { action = "DecreaseFontSize", key = "Minus",  mods = "Control" },
  { chars = "\u001b\u007f",      key = "Back",   mods = "Control" },
  { chars = "\u001b[13;2u",      key = "Return", mods = "Shift" }
]

[mouse]
hide_when_typing = true
