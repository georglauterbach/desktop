# -----------------------------------------------
# ----  Inputs  ---------------------------------
# -----------------------------------------------

input type:keyboard {
    xkb_layout de
    xkb_variant nodeadkeys
    xkb_numlock enabled
}

input type:touchpad {
    natural_scroll enabled
    tap enabled
    dwt enabled
    dwtp enabled
}

# -----------------------------------------------
# ----  Outputs  --------------------------------
# -----------------------------------------------

output eDP-1 {
    mode 1920x1080@59.950Hz
}

