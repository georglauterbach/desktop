# -----------------------------------------------
# ----  Theming  --------------------------------
# -----------------------------------------------

bindsym $spr+$alt+l exec "${HOME}/.local/bin/theme" light >/dev/null
bindsym $spr+$alt+d exec "${HOME}/.local/bin/theme" dark  >/dev/null

# -----------------------------------------------
# ----  Key Bindings  ---------------------------
# -----------------------------------------------

# browser
bindsym $spr+f exec dex \
  ~/.local/share/flatpak/exports/share/applications/app.zen_browser.zen.desktop
for_window [app_id="zen"] \
  move to workspace $wm.ws.03.name, workspace $wm.ws.03.name

# files
bindsym $spr+n exec nautilus --new-window

# VS Code
bindsym $spr+c exec codium --password-store=gnome-libsecret --enable-features=UseOzonePlatform --ozone-platform=wayland >/dev/null 2>&1
#assign [app_id="code"] $wm.ws.02.name

# MS Teams (Flatpak)
assign [app_id="com.github.IsmaelMartinez.teams_for_linux"] $wm.ws.10.name

# -----------------------------------------------
# ----  Custom Application Auto-Start  ----------
# -----------------------------------------------

exec "gdbus wait --session --timeout 60 org.kde.StatusNotifierWatcher ; /opt/zscaler/bin/ZSTray >/dev/null 2>&1 & sleep 30 ; swaymsg '[app_id=ZSTray]' kill ; pgrep '^swaync$' && swaync-client --close-all ; exec flatpak run com.github.IsmaelMartinez.teams_for_linux >/tmp/.sway.flatpak_MS_Teams.log 2>&1"
exec "bash -c 'ssh-add ${HOME}/.ssh/keys/{gitlab,github,power,tower} &>/dev/null'"
